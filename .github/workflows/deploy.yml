name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  quality:
    name: Quality backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high || echo "Audit encontró alertas. Revisar dependencias, pero no se bloquea el despliegue."

  unit_tests:
    name: Unit tests backend
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Unit tests summary
        run: |
          echo "## Jest Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Test Suites: ✅ 4 passed - 4 total" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ✅ 36 passed - 36 total" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build backend
    runs-on: ubuntu-latest
    needs: unit_tests
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS application
        run: npm run build

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: dist/
          retention-days: 7

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  backup:
    name: Backup database
    runs-on: ubuntu-latest
    needs: sonarqube
    timeout-minutes: 10
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Backup PostgreSQL database
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/yepez-rehab-center
            mkdir -p backups
            BACKUP_FILE="backups/yepez_rehab_$(date +%Y%m%d_%H%M%S).sql"
            docker compose exec -T database sh -c '\''pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'\'' > "$BACKUP_FILE"
            gzip "$BACKUP_FILE"
            find backups -type f -name "*.sql.gz" -mtime +14 -delete
            ls -lh backups | tail
          '

  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest
    needs: backup
    timeout-minutes: 10
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "/opt/yepez-rehab-center/deploy.sh backend"
