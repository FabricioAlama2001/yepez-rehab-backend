services:
  postgres:
    image: postgres:16
    container_name: yepez_rehab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: yepez_rehab_db
    ports:
      - "5433:5432"
    volumes:
      - yepez_rehab_postgres_data:/var/lib/postgresql/data

volumes:
  yepez_rehab_postgres_data:
